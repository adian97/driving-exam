
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Driving Exam Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <h1>Driving Exam</h1>

        <input type="text"
               id="username"
               placeholder="Username">

        <input type="password"
               id="password"
               placeholder="Password">

        <button onclick="login()">
            LOGIN
        </button>
    </div>
</div>

<script src="js/login.js"></script>

</body>
</html>
